name: Unpack project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p unpacked
          unzip -o WOLFESE_DISTRICT_GITHUB.zip -d unpacked

          shopt -s dotglob
          cp -R unpacked/* .
          
          rm -rf unpacked
          rm -f WOLFESE_DISTRICT_GITHUB.zip

      - name: Commit project
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy WOLFESE project" || echo "Nothing to commit"
          git push
