services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wolfese
      POSTGRES_USER: wolfese
      POSTGRES_PASSWORD: wolfese_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
